<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DSH Browser Bridge</title>
  <style>
    body { font: 14px/1.6 system-ui, "Segoe UI", sans-serif; margin: 24px; max-width: 640px; color: #1f2328; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
    button { margin-top: 16px; padding: 8px 16px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; font: inherit; cursor: pointer; }
    p.hint { color: #57606a; }
    #status { margin-top: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>DSH Browser Bridge</h1>
  <p class="hint">让 DeepSeek Harness 驱动这个 Chrome。插件面板里能看到地址和 token（<code>/browser ext</code> 也能查）。</p>
  <label for="endpoint">插件地址</label>
  <input id="endpoint" placeholder="http://127.0.0.1:9339">
  <label for="token">Token</label>
  <input id="token" placeholder="32 位十六进制">
  <button id="save">保存并重连</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
