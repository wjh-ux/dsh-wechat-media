name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows, not Ubuntu. These suites exercise the platform the plugin actually drives: PowerShell on an STA thread
    # (clipboard, desktop, dialogs, serial), registry and chrome.exe discovery (browser, extension), Windows paths and
    # CRLF handling. On the Linux runner four clipboard cases and the extension install helper failed for that reason
    # alone, which is why every run since v1.6.6 was red while the code was green on every machine it is developed on.
    # Wider OS coverage means guarding each Windows-only suite, not running them where they cannot pass.
    runs-on: windows-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The package has no dependencies and no build step: the suites are plain
      # node scripts, each printing "N passed, M failed" and exiting non-zero.
      #
      # Every suite runs even after one fails, and the job fails at the end: `set -e` used to stop at the first red
      # suite, so a single environment-sensitive case hid the state of the other forty and each fix needed another
      # full run to find the next one.
      - name: Run every suite
        shell: bash
        run: |
          failed=0
          for suite in test/*.test.mjs; do
            echo "== $suite"
            node "$suite" || failed=$((failed + 1))
          done
          echo "failing suites: $failed"
          test "$failed" -eq 0
